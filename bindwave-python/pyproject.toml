[build-system]
requires = ["hatchling>=1.26.3", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "bindwave"
version = "0.1.0"
description = "Bindwave Public API Python SDK"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranomics Inc" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]
dynamic = ["readme"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://ranomics.com/api"
Documentation = "https://ranomics.com/api"
Issues = "https://github.com/ranomics/bindwave-python/issues"
Source = "https://github.com/ranomics/bindwave-python"

[tool.hatch.build.targets.wheel]
packages = ["src/bindwave"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff",
    "mypy",
]

[tool.hatch.envs.default.scripts]
test = "pytest"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
