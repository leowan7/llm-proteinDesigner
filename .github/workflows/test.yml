name: Test Suite

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [master]

# Cancel previous runs on same PR to save CI minutes
concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start
        working-directory: .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: python -m pytest tests/ --ignore=tests/integration --cov=. --cov-fail-under=80 --cov-report=xml --cov-report=term-missing
        env:
          TESTING: "true"
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COOKIE_SECURE: "false"
          CSRF_SECRET: "ci-csrf-secret"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: node-

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test

      - name: Build frontend bundle (prerequisite for secret-leak grep)
        run: npm run build

      - name: "Guard: no server secrets in frontend bundle (Phase 11 SC 7 + Pitfall 5)"
        run: |
          if grep -rE "SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|ANTHROPIC_API_KEY|MODAL_TOKEN_SECRET|WEBHOOK_HMAC_SECRET" dist/ ; then
            echo "::error::Server-side secret leaked into frontend bundle. Fix before merge."
            exit 1
          fi
          echo "PASS: no server secrets found in frontend/dist/"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Capture local Supabase keys
        # `supabase status -o env` prints KEY=value lines; pipe to $GITHUB_ENV so
        # subsequent steps can use ${LOCAL_SUPABASE_SERVICE_ROLE_KEY} etc.
        # The local stack uses a different JWT secret than kendrew-staging,
        # so the GitHub secret SUPABASE_SERVICE_KEY does NOT validate tokens
        # against this ephemeral instance.
        run: |
          set -e
          supabase status -o env > /tmp/supabase.env
          cat /tmp/supabase.env
          # Re-export with stable names for downstream steps
          ANON=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          SVC=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          JWT=$(grep '^JWT_SECRET=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          echo "LOCAL_SUPABASE_ANON_KEY=${ANON}" >> $GITHUB_ENV
          echo "LOCAL_SUPABASE_SERVICE_ROLE_KEY=${SVC}" >> $GITHUB_ENV
          echo "LOCAL_SUPABASE_JWT_SECRET=${JWT}" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: node-

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          cd backend && uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            sleep 1
          done
        env:
          TESTING: "true"
          SUPABASE_URL: http://127.0.0.1:54321
          # Use LOCAL keys so JWT signatures match the ephemeral stack
          SUPABASE_SERVICE_KEY: ${{ env.LOCAL_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ env.LOCAL_SUPABASE_JWT_SECRET }}
          SUPABASE_ANON_KEY: ${{ env.LOCAL_SUPABASE_ANON_KEY }}
          # GH Actions services bind to localhost on the runner, not the
          # Docker-Compose-style 'redis' hostname our default uses.
          REDIS_URL: redis://localhost:6379/0
          COOKIE_SECURE: "false"
          CSRF_SECRET: "ci-csrf-secret"

      - name: Seed E2E test user
        run: |
          # Idempotent: returns 200/201 on create, 422 if exists; either is fine for tests.
          curl -sS -X POST \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"Password123!","email_confirm":true}' \
            "${SUPABASE_URL}/auth/v1/admin/users" \
            -o /tmp/seed-resp.json -w "HTTP %{http_code}\n" || true
          cat /tmp/seed-resp.json | head -c 500; echo
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_KEY: ${{ env.LOCAL_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run Playwright tests
        run: cd frontend && npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check backend/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: node-

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: TypeScript type check
        run: cd frontend && npx tsc --noEmit

      - name: ESLint (with jsx-a11y)
        run: cd frontend && npx eslint .
