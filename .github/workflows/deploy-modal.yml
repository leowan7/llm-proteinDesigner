name: Deploy Modal apps

# Live workflow (Stream E, 2026-04-22; enabled Phase 11 D-07, 2026-04-24).
#
# On pull_request (paths filtered below):
#   - Deploys all five tools-hub Modal apps to the `staging` Modal environment.
#   - Captures FunctionCall / deploy output per app.
#   - Posts a single PR comment with the deploy summary.
#
# On push to master (paths filtered below):
#   - Deploys all five tools-hub Modal apps to the `main` Modal environment (prod).
#
# Prerequisites (operator-owned; see Plan 11-03 Block D):
#   - Modal `staging` environment exists (`modal environment create staging`).
#   - Repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET are set.
#   - The five app paths below exist at HEAD.
#
# Matrix strategy: one job per app so a single-app failure does not abort the
# other four. `fail-fast: false` is required — prod deploys must be attempted
# independently.
#
# On PRs the matrix is SCOPED to the apps whose files actually changed, because
# every runner job is an independent chance to hit an infrastructure flake:
# GitHub resolves a job's actions in a single "Getting action download info"
# call during Set up job, and when that service 503s the job dies before any
# repo content exists. Nothing in this repo participates, so the only lever is
# job count. A hard-coded five-way matrix meant a one-line COMMENT change in
# rfdiffusion_app.py redeployed all five GPU apps and rolled the dice five
# times — it lost twice in one afternoon (2026-08-06: bindcraft, then pxdesign
# and boltzgen, all "Failed to resolve action download info / Service
# Unavailable").
#
# Scoping applies to pull_request ONLY. push-to-master (prod) and
# workflow_dispatch still deploy all five: a redundant prod deploy is merely
# slow, whereas a missed one is silent drift between the repo and what is
# actually serving.

on:
  pull_request:
    paths:
      - 'infrastructure/modal/**'
      - 'docker/**'
      - 'backend/pipelines/**'
      - '.github/workflows/deploy-modal.yml'
  push:
    branches: [master]
    paths:
      - 'infrastructure/modal/**'
      - 'docker/**'
      - 'backend/pipelines/**'
      - '.github/workflows/deploy-modal.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Modal environment (staging | main). Defaults to staging on PR, main on push to main, and this input otherwise.'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - main

concurrency:
  group: deploy-modal-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write  # required to post the deploy summary comment

jobs:
  detect:
    name: Detect changed apps
    runs-on: ubuntu-latest
    # Deliberately uses NO actions. A job's `uses:` steps are all resolved in
    # the single "Getting action download info" call that is exactly what
    # intermittently 503s. A job with only `run:` steps never makes that call,
    # so this gate cannot be taken out by the flake it exists to reduce.
    # `gh` and `jq` are preinstalled on ubuntu runners.
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ALL='bindcraft boltzgen pxdesign rfantibody rfdiffusion'

          emit() {
            list=$(printf '%s\n' $1 | sed '/^$/d' | sort -u)
            if [ -z "$list" ]; then
              echo 'apps=[]' >> "$GITHUB_OUTPUT"
              echo 'any=false' >> "$GITHUB_OUTPUT"
              echo "No app-owned files changed — skipping all Modal deploys."
            else
              # printf/paste rather than jq: every value has already been
              # filtered through the ALL allow-list below, so it is a bare
              # lowercase name needing no escaping. Keeps this job free of
              # tool dependencies and lets the logic be exercised locally.
              json="[$(printf '%s\n' $list | sed 's/.*/"&"/' | paste -sd, -)]"
              echo "apps=$json" >> "$GITHUB_OUTPUT"
              echo 'any=true' >> "$GITHUB_OUTPUT"
              echo "Deploying: $json"
            fi
          }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Event is ${{ github.event_name }} (not a PR) — deploying all five."
            emit "$ALL"
            exit 0
          fi

          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --jq '.[].filename')
          echo "Changed files:"; printf '%s\n' "$files" | sed 's/^/  /'

          picked=''
          for f in $files; do
            case "$f" in
              # Shared inputs — a change here cannot be attributed to one app,
              # so fall back to deploying everything rather than guessing.
              .github/workflows/deploy-modal.yml|\
              infrastructure/modal/base_image.py|\
              infrastructure/modal/__init__.py|\
              backend/pipelines/base.py|\
              backend/pipelines/__init__.py)
                echo "Shared input changed ($f) — deploying all five."
                emit "$ALL"
                exit 0
                ;;
              docker/*/*)                    picked="$picked ${f#docker/}" ;;
              infrastructure/modal/*_app.py) picked="$picked $(basename "$f" _app.py)" ;;
              backend/pipelines/*.py)        picked="$picked $(basename "$f" .py)" ;;
            esac
          done
          picked=$(printf '%s\n' $picked | cut -d/ -f1)

          # Keep only names that are really apps, so a future docker/<other>/
          # or pipelines/<helper>.py cannot inject a bogus matrix entry.
          final=''
          for p in $picked; do
            case " $ALL " in *" $p "*) final="$final $p" ;; esac
          done
          emit "$final"

  deploy:
    # Guard removed 2026-04-24 (Phase 11 D-07). Workflow is now live.
    name: Deploy ${{ matrix.app }} to ${{ github.event_name == 'pull_request' && 'staging' || (github.event_name == 'push' && 'main' || inputs.environment) }}
    needs: detect
    if: ${{ needs.detect.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'staging' || (github.event_name == 'push' && 'main' || inputs.environment) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Modal client
        run: |
          python -m pip install --upgrade pip
          # Pin to a known-working Modal client version; bump deliberately.
          pip install 'modal>=1.4,<2'

      - name: Verify Modal auth
        run: |
          modal app list --env "$MODAL_ENVIRONMENT" >/dev/null

      - name: Deploy ${{ matrix.app }}
        id: deploy
        run: |
          set -euo pipefail
          app_file="infrastructure/modal/${{ matrix.app }}_app.py"
          if [ ! -f "$app_file" ]; then
            echo "::error::$app_file not found"
            exit 1
          fi
          echo "Deploying $app_file to env=$MODAL_ENVIRONMENT"
          modal deploy --env "$MODAL_ENVIRONMENT" "$app_file" | tee "deploy-${{ matrix.app }}.log"

      - name: Extract deployment summary
        id: summary
        if: always()
        run: |
          log="deploy-${{ matrix.app }}.log"
          if [ -f "$log" ]; then
            # Modal prints the app URL and deployment ID; capture the last 20 lines.
            {
              echo "summary<<EOF"
              tail -n 20 "$log"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "summary=(no deploy log produced)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-deploy-log-${{ matrix.app }}
          path: deploy-${{ matrix.app }}.log
          if-no-files-found: warn

  comment-on-pr:
    name: Post deploy summary to PR
    needs: [detect, deploy]
    if: ${{ github.event_name == 'pull_request' && needs.detect.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all deploy logs
        uses: actions/download-artifact@v4
        with:
          path: deploy-logs
          pattern: modal-deploy-log-*
          merge-multiple: true

      - name: Build comment body
        id: body
        env:
          # Only the apps this PR actually deployed. Iterating the hard-coded
          # five here would print "(no log produced — job may have failed
          # before deploy)" for apps that were correctly skipped, which reads
          # as four failures on every PR.
          APPS: ${{ join(fromJSON(needs.detect.outputs.apps), ' ') }}
        run: |
          {
            echo "body<<EOF"
            echo "### Modal staging deploy — PR #${{ github.event.pull_request.number }}"
            echo
            echo "Commit: \`${{ github.event.pull_request.head.sha }}\`"
            echo "Environment: \`staging\`"
            echo
            for app in $APPS; do
              echo "<details><summary><code>ranomics-${app}-prod</code></summary>"
              echo
              echo '```'
              if [ -f "deploy-logs/deploy-${app}.log" ]; then
                tail -n 20 "deploy-logs/deploy-${app}.log"
              else
                echo "(no log produced — job may have failed before deploy)"
              fi
              echo '```'
              echo
              echo '</details>'
            done
            echo
            echo "FunctionCall IDs appear in the individual log tails above. Smoke-test the staging deploy with:"
            echo '```'
            echo 'modal run --env staging infrastructure/modal/<app>_app.py::run_tool --payload ''{"tier":"smoke",...}'''
            echo '```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.body.outputs.body }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.BODY,
            });
