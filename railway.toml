# Phase 11 D-06: Railway config-as-code.
# preDeployCommand runs Supabase SQL migrations before traffic shifts.
# Dockerfile bundles Supabase CLI (Plan 11-01 Task 1).
# Failed migration aborts the rollout.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# Single shell-string so $MIGRATION_DB_URL is expanded by sh -c (Railway requires
# at-most-1 element in this array; exec-form rejected at config parse).
# Uses MIGRATION_DB_URL (port 5432 direct connection) instead of DATABASE_URL
# (port 6543 Supavisor transaction pooler) — `supabase db push` uses session-level
# state that the transaction pooler rejects. Per-env values set in Railway Variables.
preDeployCommand = ["supabase db push --db-url $MIGRATION_DB_URL --yes"]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
healthcheckPath = "/health"
healthcheckTimeout = 30
numReplicas = 2
restartPolicyType = "ON_FAILURE"
