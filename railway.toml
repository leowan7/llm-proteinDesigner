# Phase 11 D-06: Railway config-as-code.
# preDeployCommand runs Supabase SQL migrations before traffic shifts.
# Dockerfile bundles Supabase CLI (Plan 11-01 Task 1).
# Failed migration aborts the rollout.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# preDeployCommand is intentionally disabled while diagnosing why deploys
# fail silently (CLI exposes only "Starting/Stopping Container" — no preDeploy
# output, no app traceback). Once main app boots cleanly, re-enable migration
# step with: ["supabase db push --db-url $MIGRATION_DB_URL --yes"]
# MIGRATION_DB_URL (port 5432 direct) is set in Railway Variables per env.
# preDeployCommand = ["supabase db push --db-url $MIGRATION_DB_URL --yes"]
# Echo PORT so we can see what Railway injects; default to 8000 if missing.
startCommand = "sh -c 'echo PORT=${PORT:-MISSING}; exec uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers --forwarded-allow-ips=\"*\"'"
healthcheckPath = "/health"
healthcheckTimeout = 30
numReplicas = 2
restartPolicyType = "ON_FAILURE"
