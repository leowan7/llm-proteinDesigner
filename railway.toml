# Phase 11 D-06: Railway config-as-code.
# preDeployCommand runs Supabase SQL migrations before traffic shifts.
# Dockerfile bundles Supabase CLI (Plan 11-01 Task 1).
# Failed migration aborts the rollout.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# Single shell-string so $MIGRATION_DB_URL is expanded by sh -c (Railway requires
# at-most-1 element in this array; exec-form rejected at config parse).
# MIGRATION_DB_URL is the Supabase session-mode shared pooler at port 5432
# (aws-1-us-east-1.pooler.supabase.com); DATABASE_URL is the transaction-mode
# pooler at port 6543 on the same host. Per-env values in Railway Variables.
preDeployCommand = ["sh -c \"supabase db push --db-url $MIGRATION_DB_URL --yes\""]
# Wrap startCommand in sh -c so $PORT (Railway-injected, e.g. 8080) is shell-
# expanded — exec-form passes the literal $PORT to uvicorn which then errors.
startCommand = "sh -c 'exec uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=\"*\"'"
healthcheckPath = "/health"
healthcheckTimeout = 30
numReplicas = 2
restartPolicyType = "ON_FAILURE"
